[options]
; ---- database ----
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; list_db = True keeps the database manager available for creating the demo DB
list_db = True

; ---- addons ----
; /mnt/extra-addons is this repo, bind-mounted from the host
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; ---- paths ----
data_dir = /var/lib/odoo

; ---- master password for the database manager ----
admin_passwd = admin

; ---- workers ----
; 0 = single-process (threaded) mode: needed for --dev reload and easier debugging
workers = 0
max_cron_threads = 1

; ---- logging ----
log_level = info

; ---- dev conveniences (comment out for anything production-like) ----
dev_mode = reload,qweb,xml
